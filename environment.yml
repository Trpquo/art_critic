name: fastai
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.12
  - pytorch=2.4.0
  - torchvision=0.19.0
  - pytorch-cuda=12.4
  - ipykernel
  - mkl
  - mkl-service
  - mkl-devel
  - blas=*=mkl
  - jupyterlab
  - fastcore>=1.5,<1.7
  - fastai<2.8
  - pandas
  - numpy
  - scikit-learn
  - pillow
  - pyarrow
  - seaborn
  - graphviz
  - setuptools
  - imagehash
  - requests
